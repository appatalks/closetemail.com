name: Nuclear Event Alert System

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:  # Allows for manual trigger
    inputs:
      simulate_lat:
        description: 'Latitude for simulation'
        required: false
        default: ''
      simulate_lon:
        description: 'Longitude for simulation'
        required: false
        default: ''
      simulate_radiation:
        description: 'Simulated radiation level'
        required: false
        default: ''
      debug_level:
        description: 'Debug level (0=None, 1=Error, 2=Warning, 3=Info, 4=Detail, 5=Trace)'
        required: false
        default: '4'
        type: choice
        options:
          - '0'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
      save_logs:
        description: 'Save debug logs as artifact'
        required: false
        default: true
        type: boolean
      dry_run:
        description: 'Evaluate and log alerts without posting to Bluesky'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: nuclear-event-monitor
  cancel-in-progress: false

jobs:
  monitor-events:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Check out the repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: pip install requests

    - name: Run monitoring check
      env:
        BLUESKY_CLOSET_H: ${{ secrets.BLUESKY_CLOSET_H }}
        BLUESKY_CLOSET_P: ${{ secrets.BLUESKY_CLOSET_P }}
      run: |
        LOG_FILE=""
        if [[ "${{ github.event_name == 'schedule' || inputs.save_logs }}" == "true" ]]; then
          LOG_FILE="nuclear_monitoring_$(date +%Y%m%d_%H%M%S).log"
          echo "Log file will be saved as: $LOG_FILE"
        fi

        args=(
          python src/check_nuclear_events.py
          --debug-level "${{ inputs.debug_level || '3' }}"
          --lookback-minutes 30
        )
        [[ -n "${{ inputs.simulate_lat }}" ]] && args+=(--simulate-lat "${{ inputs.simulate_lat }}")
        [[ -n "${{ inputs.simulate_lon }}" ]] && args+=(--simulate-lon "${{ inputs.simulate_lon }}")
        [[ -n "${{ inputs.simulate_radiation }}" ]] && args+=(--simulate-radiation "${{ inputs.simulate_radiation }}")
        [[ "${{ inputs.dry_run }}" == "true" ]] && args+=(--dry-run)
        [[ -n "$LOG_FILE" ]] && args+=(--output "$LOG_FILE")

        printf 'Running:'
        printf ' %q' "${args[@]}"
        printf '\n'
        "${args[@]}"

        if [[ -n "$LOG_FILE" && -f "$LOG_FILE" ]]; then
          echo "=== Log File Summary (last 20 lines) ==="
          tail -n 20 "$LOG_FILE"
          echo "=== End of Log Summary ==="
        fi

    - name: Upload monitoring logs
      if: ${{ always() && (github.event_name == 'schedule' || inputs.save_logs) }}
      uses: actions/upload-artifact@v7
      with:
        name: nuclear-monitoring-logs
        path: nuclear_monitoring_*.log
        retention-days: 7
        if-no-files-found: warn
